{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="acceso-formulario">
  <section class="tarjeta-formulario" aria-labelledby="titulo-login">
    <header class="tarjeta-formulario__cabecera">
      <h1 id="titulo-login">Iniciar sesión</h1>
      <p class="tarjeta-formulario__subtitulo">
        Accede con tu usuario del sistema para gestionar reservas y préstamos.
      </p>
    </header>

    <form method="post" action="{{ url_for('web.login_post') }}" class="formulario" novalidate>
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ siguiente }}">

      <div class="campo">
        <label for="campo-username">Usuario</label>
        <input type="text" id="campo-username" name="username"
               value="{{ usuario_intentado or '' }}"
               required autofocus autocomplete="username"
               minlength="4" maxlength="20" placeholder="admin">
      </div>

      <div class="campo">
        <label for="campo-password">Contraseña</label>
        <input type="password" id="campo-password" name="password"
               required autocomplete="current-password"
               minlength="8" placeholder="••••••••">
      </div>

      <div class="formulario__acciones">
        <button type="submit" class="boton boton--primario boton--ancho">Entrar</button>
      </div>
    </form>

    <aside class="nota-credenciales">
      <h2>Usuarios de prueba</h2>
      <ul>
        <li><code>admin</code> / <code>Admin123!</code> — Administrador</li>
        <li><code>operador</code> / <code>Operador123!</code> — Operador</li>
      </ul>
    </aside>
  </section>
</div>
{% endblock %}
